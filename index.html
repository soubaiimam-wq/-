<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مذاكر – Moudhakkir</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Noto+Sans+Tifinagh&display=swap" rel="stylesheet">
<style>
:root{--nv:#0B1F3A;--n2:#1B4578;--ns:#E8F0FA;--gr:#22C55E;--gs:#DCFCE7;--bg:#F4F7FB;--bd:#E2E8F0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Noto Sans Tifinagh',sans-serif;background:var(--bg);color:#0F172A;line-height:1.5;padding-bottom:68px}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:40}
.langs{display:flex;gap:3px;background:var(--bg);padding:3px;border-radius:9px}
.langs button{border:0;background:none;padding:6px 9px;border-radius:7px;font:700 .82rem inherit;cursor:pointer;color:#475569}
.langs button.active{background:var(--nv);color:#fff}
.wrap{max-width:980px;margin:12px auto;padding:0 12px;display:grid;grid-template-columns:200px 1fr;gap:14px}
aside{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:10px;height:fit-content}
.nb{width:100%;display:flex;gap:7px;padding:9px;border:0;background:none;border-radius:9px;font:700 .9rem inherit;color:#475569;cursor:pointer;text-align:start;margin-bottom:2px}
.nb.active{background:var(--nv);color:#fff}
.hero{background:linear-gradient(135deg,var(--nv),var(--n2));color:#fff;padding:16px;border-radius:14px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.item{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer}
.pill{padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);font:700 .84rem inherit;cursor:pointer}
.pill.active{background:var(--gr);color:var(--nv)}
.btn{padding:8px 14px;border-radius:9px;border:0;font:700 .86rem inherit;cursor:pointer;text-decoration:none;display:inline-block}
.bg{background:var(--gr);color:var(--nv)}.bn{background:var(--nv);color:#fff}
.opt{display:block;width:100%;text-align:start;padding:8px;margin-top:5px;border-radius:8px;border:1px solid var(--bd);background:#fff;font:600 .88rem inherit;cursor:pointer}
.opt.ok{background:var(--gs);border-color:#16A34A}.opt.no{background:#FEE2E2;border-color:#DC2626}
.se
