<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مذاكر – Moudhakkir | منصة تعليمية مغربية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Noto+Sans+Tifinagh&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:#0B1F3A; --navy-mid:#123158; --navy-light:#1B4578; --navy-soft:#E8F0FA;
      --green:#22C55E; --green-light:#4ADE80; --green-soft:#DCFCE7;
      --bg:#F4F7FB; --white:#FFFFFF; --text:#0F172A; --muted:#475569; --border:#E2E8F0;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Cairo','Plus Jakarta Sans','Noto Sans Tifinagh',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding-bottom:78px; }
    header { background:var(--white); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:40; }
    .brand { display:flex; align-items:center; gap:10px; cursor:pointer; }
    .langs { display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:10px; border:1px solid var(--border); }
    .langs button { border:none; background:transparent; padding:6px 10px; border-radius:8px; font-family:inherit; font-weight:700; cursor:pointer; color:var(--muted); font-size:0.84rem; }
    .langs button.active { background:var(--navy); color:var(--white); }
    .wrap { max-width:1100px; margin:16px auto; padding:0 14px; display:grid; grid-template-columns:240px 1fr; gap:18px; }
    aside { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:14px; height:fit-content; position:sticky; top:76px; }
    .nav-btn { width:100%; display:flex; align-items:center; gap:8px; padding:10px 12px; border:none; background:transparent; border-radius:10px; font-family:inherit; font-weight:700; color:var(--muted); cursor:pointer; text-align:start; margin-bottom:4px; }
    .nav-btn.active { background:var(--navy); color:var(--white); }
    .hero { background:linear-gradient(135deg, var(--navy), var(--navy-light)); color:#fff; padding:24px; border-radius:18px; margin-bottom:16px; }
    .card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:12px; }
    .item { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; transition:0.2s; }
    .item:hover { border-color:var(--green); transform:translateY(-2px); }
    .pill { padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--bg); font-family:inherit; font-weight:700; cursor:pointer; font-size:0.86rem; }
    .pill.active { background:var(--green); color:var(--navy); border-color:#16A34A; }
    .btn { padding:9px 16px; border-radius:10px; border:none; font-family:inherit; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; font-size:0.88rem; }
    .btn-green { background:var(--green); color:var(--navy); }
    .btn-navy { background:var(--navy); color:var(--white); }
    .demo-tag { background:#FEF3C7; color:#92400E; font-size:0.75rem; font-weight:700; padding:3px 10px; border-radius:999px; display:inline-block; }
    .opt { display:block; width:100%; text-align:start; padding:10px; margin-top:6px; border-radius:8px; border:1px solid var(--border); background:var(--white); font-family:inherit; font-weight:600; cursor:pointer; }
    .opt.ok { background:var(--green-soft); border-color:#16A34A; color:#14532D; }
    .opt.no { background:#FEE2E2; border-color:#DC2626; color:#7F1D1D; }
    .sec { display:none; }
    .sec.active { display:block; }
    .chat-box { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px; height:230px; overflow-y:auto; margin:10px 0; display:flex; flex-direction:column; gap:8px; }
    .msg { padding:9px 12px; border-radius:10px; max-width:85%; font-size:0.88rem; }
    .msg.bot { background:var(--white); border:1px solid var(--border); align-self:flex-start; }
    .msg.usr { background:var(--navy); color:var(--white); align-self:flex-end; }
    .track-bar { width:100%; height:12px; background:var(--bg); border-radius:999px; overflow:hidden; margin-top:8px; }
    .track-fill { height:100%; background:linear-gradient(90deg, var(--green), var(--navy-light)); width:0%; transition:width 0.3s; }
    nav.bnav { display:none; position:fixed; bottom:0; left:0; right:0; background:var(--white); border-top:1px solid var(--border); justify-content:space-around; padding:7px 4px; z-index:50; }
    nav.bnav button { border:none; background:transparent; font-family:inherit; font-size:0.72rem; font-weight:700; display:flex; flex-direction:column; align-items:center; color:var(--muted); cursor:pointer; }
    nav.bnav button.active { color:var(--navy); }
    .modal { display:none; position:fixed; inset:0; background:rgba(11,31,58,0.6); z-index:90; align-items:center; justify-content:center; padding:14px; }
    .modal.open { display:flex; }
    .modal-in { background:var(--white); border-radius:16px; max-width:620px; width:100%; padding:20px; max-height:85vh; overflow-y:auto; }
    footer { text-align:center; padding:16px; color:var(--muted); font-size:0.82rem; border-top:1px solid var(--border); background:var(--white); margin-top:20px; }
    @media (max-width:880px) { .wrap { grid-template-columns:1fr; } aside { display:none; } nav.bnav { display:flex; } }
  </style>
</head>
